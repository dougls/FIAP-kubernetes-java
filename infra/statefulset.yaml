apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: app
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: java
          image: eclipse-temurin:21-jre
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              java -XX:MaxRAMPercentage=75.0 -XshowSettings:vm -version
              sleep infinity
          resources:
            limits:
              memory: 1Gi
          volumeMounts:
            - name: dados
              mountPath: /dados
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
