apiVersion: v1
kind: Pod
metadata:
  name: java-nu
  labels:
    app: java-nu
spec:
  containers:
  - name: java
    image: eclipse-temurin:21-jre
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c"]
    args:
      - |
        java -XX:MaxRAMPercentage=75.0 -XshowSettings:vm -version
        sleep infinity
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 200m
        memory: 1Gi
